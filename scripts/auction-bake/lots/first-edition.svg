<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1000" viewBox="0 0 1000 1000">
  <!-- The book's stamping, as masks. Green is anything the brass struck
       (it is pressed into the cloth); red is gold leaf, which is always
       struck too, so gilt is yellow. The front board is x 0..640 (hinge at
       the left), the spine x 700..870 (front cover's side at the left). -->
  <defs>
    <!-- An arabesque corner-piece, struck blind. -->
    <symbol id="arab" viewBox="0 0 120 120" overflow="visible">
      <g fill="none" stroke="#00ff00" stroke-width="4" stroke-linecap="round">
        <path d="M6 6 C 40 6, 70 14, 86 34 C 96 48, 86 64, 70 58 C 58 54, 62 38, 74 40"/>
        <path d="M6 6 C 6 40, 14 70, 34 86 C 48 96, 64 86, 58 70 C 54 58, 38 62, 40 74"/>
        <path d="M6 6 C 30 30, 44 44, 58 58"/>
      </g>
      <g fill="#00ff00">
        <circle cx="62" cy="62" r="6"/>
        <path d="M18 18 q 16 2 22 12 q -12 2 -22 -12z"/>
        <path d="M18 18 q 2 16 12 22 q 2 -12 -12 -22z"/>
        <circle cx="100" cy="14" r="3.5"/>
        <circle cx="14" cy="100" r="3.5"/>
      </g>
    </symbol>
    <!-- A small gilt rule ornament for the spine: a fillet, a row of dots, a fillet. -->
    <g id="sband">
      <rect x="712" y="0" width="146" height="3.5" fill="#ffff00"/>
      <rect x="712" y="16" width="146" height="3.5" fill="#ffff00"/>
      <g fill="#ffff00">
        <circle cx="720" cy="9.8" r="2.6"/><circle cx="732" cy="9.8" r="2.6"/><circle cx="744" cy="9.8" r="2.6"/>
        <circle cx="756" cy="9.8" r="2.6"/><circle cx="768" cy="9.8" r="2.6"/><circle cx="780" cy="9.8" r="2.6"/>
        <circle cx="792" cy="9.8" r="2.6"/><circle cx="804" cy="9.8" r="2.6"/><circle cx="816" cy="9.8" r="2.6"/>
        <circle cx="828" cy="9.8" r="2.6"/><circle cx="840" cy="9.8" r="2.6"/><circle cx="852" cy="9.8" r="2.6"/>
      </g>
    </g>
  </defs>

  <rect width="1000" height="1000" fill="#000000"/>

  <!-- ===== The front board ===== -->
  <!-- A thick-and-thin rule round the edge, struck blind. -->
  <rect x="26" y="26" width="588" height="948" fill="none" stroke="#00ff00" stroke-width="7"/>
  <rect x="40" y="40" width="560" height="920" fill="none" stroke="#00ff00" stroke-width="2.5"/>
  <!-- An inner panel with arabesque corners. -->
  <rect x="70" y="70" width="500" height="860" fill="none" stroke="#00ff00" stroke-width="2.5"/>
  <use xlink:href="#arab" x="76" y="76" width="120" height="120"/>
  <use xlink:href="#arab" x="76" y="76" width="120" height="120" transform="matrix(-1 0 0 1 640 0)"/>
  <use xlink:href="#arab" x="76" y="76" width="120" height="120" transform="matrix(1 0 0 -1 0 1000)"/>
  <use xlink:href="#arab" x="76" y="76" width="120" height="120" transform="matrix(-1 0 0 -1 640 1000)"/>
  <!-- A blind cartouche in the middle, and the title in gilt inside it. -->
  <ellipse cx="320" cy="470" rx="210" ry="128" fill="none" stroke="#00ff00" stroke-width="6"/>
  <ellipse cx="320" cy="470" rx="198" ry="116" fill="none" stroke="#00ff00" stroke-width="2"/>
  <g font-family="Baskerville Old Face" text-anchor="middle" fill="#ffff00">
    <text x="320" y="442" font-size="31" letter-spacing="2">THE DRAINAGE</text>
    <text x="320" y="474" font-size="20" letter-spacing="4">OF THE</text>
    <text x="320" y="514" font-size="33" letter-spacing="2">LOWER WITHAM</text>
  </g>
  <rect x="280" y="532" width="100" height="2.5" fill="#ffff00"/>

  <!-- ===== The spine ===== -->
  <use xlink:href="#sband" y="30"/>
  <use xlink:href="#sband" y="66"/>
  <g font-family="Baskerville Old Face" text-anchor="middle" fill="#ffff00">
    <text x="785" y="172" font-size="20" letter-spacing="2">ON THE</text>
    <text x="785" y="210" font-size="23" letter-spacing="1">DRAINAGE</text>
    <text x="785" y="244" font-size="20" letter-spacing="2">OF THE</text>
    <text x="785" y="284" font-size="26" letter-spacing="2">LOWER</text>
    <text x="785" y="320" font-size="25" letter-spacing="1">WITHAM</text>
  </g>
  <rect x="755" y="350" width="80" height="3" fill="#ffff00"/>
  <g font-family="Baskerville Old Face" text-anchor="middle" fill="#ffff00">
    <text x="785" y="398" font-size="20" letter-spacing="3">PELL</text>
  </g>
  <!-- Blind rules down the spine, and a small blind ornament. -->
  <rect x="712" y="500" width="146" height="3" fill="#00ff00"/>
  <rect x="712" y="508" width="146" height="1.5" fill="#00ff00"/>
  <path d="M785 600 l 18 30 l -18 30 l -18 -30 z" fill="none" stroke="#00ff00" stroke-width="3"/>
  <circle cx="785" cy="630" r="5" fill="#00ff00"/>
  <rect x="712" y="752" width="146" height="1.5" fill="#00ff00"/>
  <rect x="712" y="758" width="146" height="3" fill="#00ff00"/>
  <g font-family="Baskerville Old Face" text-anchor="middle" fill="#ffff00">
    <text x="785" y="860" font-size="18" letter-spacing="2">HOBDAY</text>
    <text x="785" y="884" font-size="14" letter-spacing="2">&amp; SON</text>
  </g>
  <use xlink:href="#sband" y="914"/>
  <use xlink:href="#sband" y="950"/>
</svg>
