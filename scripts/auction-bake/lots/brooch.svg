<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 2048 2048">
  <!-- The brooch's gilding, white on black, as two strips the model wraps
       round the enamel border: the inscription across the top arc and a
       spray of ivy and forget-me-nots across the bottom one. -->
  <rect width="2048" height="2048" fill="#000"/>
  <!-- Strip 1 (rows 0-256): the inscription. Letters stand on the strip's
       bottom edge, which is the border's inner edge. -->
  <text x="1024" y="196" font-family="Times New Roman, Georgia, serif" font-size="178" font-weight="bold"
        letter-spacing="34" text-anchor="middle" fill="#fff">IN MEMORY</text>
  <!-- Strip 2 (rows 320-576): the ivy spray, mirrored about the middle. -->
  <g transform="translate(0,320)" fill="#fff" stroke="#fff">
    <g id="spray">
      <path d="M1024 128 C 860 120, 700 150, 520 128 S 260 110, 120 128" fill="none" stroke-width="12"/>
      <g stroke="none">
        <ellipse cx="930" cy="96" rx="44" ry="18" transform="rotate(-24 930 96)"/>
        <ellipse cx="880" cy="160" rx="44" ry="18" transform="rotate(22 880 160)"/>
        <ellipse cx="780" cy="94" rx="46" ry="19" transform="rotate(-20 780 94)"/>
        <ellipse cx="720" cy="162" rx="46" ry="19" transform="rotate(26 720 162)"/>
        <ellipse cx="620" cy="98" rx="42" ry="17" transform="rotate(-22 620 98)"/>
        <ellipse cx="560" cy="158" rx="42" ry="17" transform="rotate(20 560 158)"/>
        <ellipse cx="455" cy="96" rx="38" ry="16" transform="rotate(-18 455 96)"/>
        <ellipse cx="400" cy="152" rx="36" ry="15" transform="rotate(24 400 152)"/>
        <ellipse cx="300" cy="104" rx="32" ry="14" transform="rotate(-20 300 104)"/>
        <ellipse cx="250" cy="148" rx="30" ry="13" transform="rotate(22 250 148)"/>
        <ellipse cx="160" cy="114" rx="26" ry="11" transform="rotate(-14 160 114)"/>
        <circle cx="110" cy="128" r="14"/>
      </g>
    </g>
    <use href="#spray" transform="translate(2048,0) scale(-1,1)"/>
    <!-- A forget-me-not at the middle: five petals round a ring. -->
    <g stroke="none">
      <circle cx="1024" cy="74" r="30"/><circle cx="1076" cy="112" r="30"/><circle cx="1056" cy="172" r="30"/>
      <circle cx="992" cy="172" r="30"/><circle cx="972" cy="112" r="30"/>
    </g>
    <circle cx="1024" cy="128" r="20" fill="#000" stroke="none"/>
    <circle cx="1024" cy="128" r="9" stroke="none"/>
  </g>
</svg>
