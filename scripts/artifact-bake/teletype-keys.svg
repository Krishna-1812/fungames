<text x="832" y="345" font-size="72" text-anchor="middle">H</text>
<text x="960" y="345" font-size="72" text-anchor="middle">J</text>
<text x="1088" y="345" font-size="72" text-anchor="middle">K</text>
<text x="1216" y="345" font-size="72" text-anchor="middle">L</text>
<text x="1344" y="345" font-size="72" text-anchor="middle">;</text>
