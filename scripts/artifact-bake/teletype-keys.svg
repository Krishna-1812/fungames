<text x="448" y="217" font-size="72" text-anchor="middle">E</text>
<text x="576" y="217" font-size="72" text-anchor="middle">R</text>
<text x="704" y="217" font-size="72" text-anchor="middle">T</text>
<text x="832" y="217" font-size="72" text-anchor="middle">Y</text>
<text x="960" y="217" font-size="72" text-anchor="middle">U</text>
<text x="1088" y="217" font-size="72" text-anchor="middle">I</text>
<text x="1216" y="217" font-size="72" text-anchor="middle">O</text>
<text x="1344" y="217" font-size="72" text-anchor="middle">P</text>
<text x="1472" y="217" font-size="72" text-anchor="middle">@</text>
