<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="640" viewBox="0 0 1536 640">
  <!-- A legend atlas: 12 columns by 5 rows of 128px cells, one per keycap (the
       last row, the space bar, is blank). Cream on black: the model reads the
       brightness as where the legend is printed. -->
<rect width="1536" height="640" fill="#000"/>
<g font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#efe6c8">
<text x="64" y="77.3" font-size="38" text-anchor="middle">ESC</text>
<text x="192" y="89" font-size="72" text-anchor="middle">1</text>
<text x="320" y="89" font-size="72" text-anchor="middle">2</text>
<text x="448" y="89" font-size="72" text-anchor="middle">3</text>
<text x="576" y="89" font-size="72" text-anchor="middle">4</text>
<text x="704" y="89" font-size="72" text-anchor="middle">5</text>
<text x="832" y="89" font-size="72" text-anchor="middle">6</text>
<text x="960" y="89" font-size="72" text-anchor="middle">7</text>
<text x="1088" y="89" font-size="72" text-anchor="middle">8</text>
<text x="1216" y="89" font-size="72" text-anchor="middle">9</text>
<text x="1344" y="89" font-size="72" text-anchor="middle">0</text>
<text x="1472" y="89" font-size="72" text-anchor="middle">:</text>
<text x="64" y="202.5" font-size="30" text-anchor="middle">CTRL</text>
