<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <!-- The LCD: a plain wiki page, "HomePage", with the first edit on it. A
       bare browser window around it, no program's name. -->
  <rect width="1024" height="768" fill="#d4d0c8"/>
  <rect x="0" y="0" width="1024" height="34" fill="#4a6aa8"/>
  <text x="14" y="25" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#fff">HomePage - Browser</text>
  <rect x="0" y="34" width="1024" height="56" fill="#d4d0c8"/>
  <rect x="96" y="44" width="880" height="36" fill="#fff" stroke="#808080" stroke-width="2"/>
  <text x="108" y="70" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#000">http://www.wikipedia.com/</text>
  <g fill="#d4d0c8" stroke="#808080" stroke-width="2"><rect x="12" y="44" width="34" height="36"/><rect x="52" y="44" width="34" height="36"/></g>
  <rect x="0" y="90" width="1024" height="678" fill="#fff"/>
  <path d="M0 90H1024" stroke="#808080" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#1a0dab" text-decoration="underline">
    <text x="48" y="150">HomePage</text><text x="176" y="150">RecentChanges</text><text x="360" y="150">Preferences</text><text x="520" y="150">Random Page</text><text x="700" y="150">Find</text>
  </g>
  <line x1="48" y1="176" x2="976" y2="176" stroke="#999" stroke-width="2"/>
  <text x="48" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="700" fill="#000">HomePage</text>
  <line x1="48" y1="298" x2="976" y2="298" stroke="#999" stroke-width="2"/>
  <text x="48" y="388" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#000">This is the new WikiPedia!</text>
  <line x1="48" y1="660" x2="976" y2="660" stroke="#999" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1a0dab">
    <text x="48" y="700" text-decoration="underline">Edit text of this page</text>
    <text x="320" y="700" fill="#000">(last edited January 15, 2001)</text>
    <text x="48" y="734" text-decoration="underline">Find page by browsing, searching or an index</text>
  </g>
</svg>
