name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets a deploy be re-run by hand from the Actions tab without a new commit.
  workflow_dispatch:

# Deploys straight from the Actions run rather than to a gh-pages branch, so
# there is no second branch to keep in sync — these are the permissions that
# needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy in flight at a time; a second push while one is running
# waits rather than racing it, and does not cancel work already most of the
# way to live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
